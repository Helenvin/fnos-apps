name: Mirror upstream releases

on:
  workflow_dispatch:
  schedule:
    - cron: '20 2 * * *'

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror latest releases per app from conversun/fnos-apps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          UPSTREAM="conversun/fnos-apps"
          FORK="Helenvin/fnos-apps"

          gh api "repos/${UPSTREAM}/releases?per_page=100" --paginate > /tmp/upstream.json
          gh api "repos/${FORK}/tags?per_page=100" --paginate > /tmp/existing.json
          EXISTING=$(jq -r '.[].name' /tmp/existing.json)

          # latest release per slug (same rule as generate-apps-json.sh).
          # EXCLUDED_SLUGS covers two kinds of never-upstream apps:
          #   fnos-apps-store - we publish our own patched build of it
          #   EM2B            - hand-uploaded and frozen on purpose; an upstream
          #                     release for it must never be mirrored in
          EXCLUDED_SLUGS='["fnos-apps-store","EM2B"]'
          mapfile -t RELS < <(jq -r --argjson excl "$EXCLUDED_SLUGS" '
            [.[] | select(.draft == false)]
            | group_by(.tag_name | split("/")[0])
            | map(sort_by(.published_at) | last)
            | .[] | (.tag_name | split("/")[0]) as $slug
            | select(($excl | index($slug)) == null)
            | [.tag_name] | @tsv' /tmp/upstream.json)
          echo "releases to consider: ${#RELS[@]}"

          for TAG in "${RELS[@]}"; do
            if grep -qxF "$TAG" <<< "$EXISTING"; then echo "exists: $TAG"; continue; fi
            echo "mirroring $TAG"
            TITLE=$(jq -r --arg t "$TAG" '.[] | select(.tag_name == $t) | .name // ""' /tmp/upstream.json)
            REL_ID=$(gh api -X POST "repos/${FORK}/releases" \
              -f tag_name="$TAG" -f name="$TITLE" \
              -f body="Mirrored from ${UPSTREAM}" --jq '.id') || { echo "  create FAILED"; continue; }
            while IFS=$'\t' read -r NAME BURL; do
              [ -z "$NAME" ] && continue
              code=$(curl -sL -o /tmp/asset.bin -w '%{http_code}' "$BURL")
              if [ "$code" != "200" ]; then echo "  download failed $NAME ($code)"; continue; fi
              up=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "Content-Type: application/octet-stream" \
                --data-binary "@/tmp/asset.bin" \
                "https://uploads.github.com/repos/${FORK}/releases/${REL_ID}/assets?name=${NAME}")
              echo "  ${NAME} upload=${up}"
              rm -f /tmp/asset.bin
            done < <(jq -r --arg t "$TAG" '.[] | select(.tag_name == $t) | .assets[] | [.name, .browser_download_url] | @tsv' /tmp/upstream.json)
          done
          echo "upstream mirror done"

      - name: Sync native app releases (renamed for store convention)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FORK="Helenvin/fnos-apps"

          sync_native() {
            local SRC_REPO="$1" SRC_TAG="$2" SLUG="$3" PREFIX="$4" VER="$5"
            local DST_TAG="${SLUG}/v${VER}"
            if gh api "repos/${FORK}/releases/tags/${DST_TAG}" >/dev/null 2>&1; then
              echo "native exists: ${DST_TAG}"; return
            fi
            echo "sync native ${SRC_REPO}@${SRC_TAG} -> ${DST_TAG}"
            local REL_ID
            REL_ID=$(gh api -X POST "repos/${FORK}/releases" \
              -f tag_name="${DST_TAG}" -f name="${DST_TAG}" \
              -f body="Native app fpk synced from ${SRC_REPO}" --jq '.id') || { echo "  create FAILED"; return; }
            for ARCH in x86 arm; do
              local SRC_NAME="${PREFIX}_${ARCH}_${VER}.fpk"
              local DST_NAME="${PREFIX}_${VER}_${ARCH}.fpk"
              local code
              code=$(curl -sL -o /tmp/native.fpk -w '%{http_code}' \
                "https://github.com/${SRC_REPO}/releases/download/${SRC_TAG}/${SRC_NAME}")
              if [ "$code" != "200" ]; then echo "  download failed ${SRC_NAME} ($code)"; continue; fi
              local up
              up=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header "Content-Type: application/octet-stream" \
                --data-binary "@/tmp/native.fpk" \
                "https://uploads.github.com/repos/${FORK}/releases/${REL_ID}/assets?name=${DST_NAME}")
              echo "  ${DST_NAME} upload=${up}"
              rm -f /tmp/native.fpk
            done
          }

          # mdcng: source repo Helenvin/mdc-ng-fpk was deleted (native MDC-NG retired) - no sync
          LPTAG=$(gh api repos/Helenvin/LitePan-fpk/releases/latest --jq '.tag_name' 2>/dev/null || echo "")
          if [ -n "$LPTAG" ]; then
            LPVER=$(echo "$LPTAG" | sed 's/^v//; s/-fpk.*//')
            sync_native "Helenvin/LitePan-fpk" "$LPTAG" "LitePan" "LitePan" "$LPVER"
          else
            echo "[WARN] LitePan-fpk latest release not found, skip sync"
          fi

          # --- fnclearup: single all-platform fpk stored inside the FnDepot git repo ---
          # Upstream has no GitHub Releases; version + sha256 come from its fnpack.json index.
          # Store convention needs <prefix>_<ver>_<arch>.fpk, so the same all-arch fpk is
          # uploaded twice (x86/arm).
          FNDEPOT="Wyf841015/FnDepot"
          FNPACK=$(curl -sL "https://raw.githubusercontent.com/${FNDEPOT}/main/fnpack.json")
          # fnpack.json schema v2: releases.<ver> = {changelog, packages.<arch>={download_url,sha256,size}}
          FNVER=$(printf '%s' "$FNPACK" | jq -r \
            '.apps.fnclearup.releases | keys | max_by(split(".") | map(tonumber))')
          FNSHA=$(printf '%s' "$FNPACK" | jq -r --arg v "$FNVER" \
            '.apps.fnclearup.releases[$v].packages.all.sha256')
          FNCHANGELOG=$(printf '%s' "$FNPACK" | jq -r --arg v "$FNVER" \
            '.apps.fnclearup.releases[$v].changelog // ""')
          FNDL=$(printf '%s' "$FNPACK" | jq -r --arg v "$FNVER" \
            '.apps.fnclearup.releases[$v].packages.all.download_url // "fnclearup/fnclearup.fpk"')
          FN_TAG="fnclearup/v${FNVER}"
          if gh api "repos/${FORK}/releases/tags/${FN_TAG}" >/dev/null 2>&1; then
            echo "fndepot native exists: ${FN_TAG}"
          else
            echo "sync fndepot fnclearup@${FNVER} -> ${FN_TAG}"
            code=$(curl -sL -o /tmp/fnclearup.fpk -w '%{http_code}' \
              "https://raw.githubusercontent.com/${FNDEPOT}/main/${FNDL}")
            actual_sha=$(sha256sum /tmp/fnclearup.fpk 2>/dev/null | cut -d" " -f1 || echo none)
            if [ "$code" = "200" ] && [ "$actual_sha" = "$FNSHA" ]; then
              FN_BODY=$(printf '%s\n\n----------------------------------------\n%s\nsha256: %s\nRequires nodejs_v24 runtime (install from App Center first).' \
                "$FNCHANGELOG" \
                "Native app fpk synced from FnDepot (${FNDEPOT}), upstream author: 再见一零一二 (gitee.com/wyf1015)." \
                "$FNSHA")
              FN_ID=$(gh api -X POST "repos/${FORK}/releases" \
                -f tag_name="${FN_TAG}" -f name="${FN_TAG}" \
                -f body="$FN_BODY" \
                --jq ".id") || FN_ID=""
              if [ -n "$FN_ID" ]; then
                for ARCH in x86 arm; do
                  up=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                    --header "Authorization: Bearer $GH_TOKEN" \
                    --header "Content-Type: application/octet-stream" \
                    --data-binary "@/tmp/fnclearup.fpk" \
                    "https://uploads.github.com/repos/${FORK}/releases/${FN_ID}/assets?name=fnclearup_${FNVER}_${ARCH}.fpk")
                  echo "  fnclearup_${FNVER}_${ARCH}.fpk upload=${up}"
                done
              fi
            else
              echo "  download or sha256 check FAILED (http=${code})"
            fi
            rm -f /tmp/fnclearup.fpk
          fi

          # Mirror fnclearup icon into this repo (store icon_url must not depend on upstream)
          FN_ICON_PATH="native-assets/fnclearup/ICON_256.PNG"
          if ! gh api "repos/${FORK}/contents/${FN_ICON_PATH}" >/dev/null 2>&1; then
            curl -sL -o /tmp/fn_icon.png "https://raw.githubusercontent.com/${FNDEPOT}/main/fnclearup/ICON_256.PNG"
            FN_ICON_B64=$(base64 -w0 /tmp/fn_icon.png)
            if gh api -X PUT "repos/${FORK}/contents/${FN_ICON_PATH}" \
              -f message="chore: add fnclearup store icon (synced from FnDepot)" \
              -f content="$FN_ICON_B64" >/dev/null 2>&1; then
              echo "fnclearup icon mirrored to ${FN_ICON_PATH}"
            else
              echo "[WARN] fnclearup icon upload FAILED"
            fi
            rm -f /tmp/fn_icon.png
          fi

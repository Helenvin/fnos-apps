services:
  avdb:
    image: ${DOCKER_MIRROR}docker.io/leolitaly/avdb:${VERSION}
    container_name: avdb
    restart: unless-stopped
    ports:
      - "${TRIM_SERVICE_PORT}:8000"
    volumes:
      # 数据目录：向导留空时使用应用专属数据空间（TRIM_PKGVAR，fnOS 自动管理）；
      # 填写旧路径（如 /vol1/1000/docker/avdb/data）可原地继承手动部署的数据库/规则/下载记录
      - ${wizard_data_dir:-${TRIM_PKGVAR:?}/data}:/data
      # 联动 MDC-NG：映射表变更后自动重启 MDC 容器
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DATABASE_URL=sqlite:////data/avdb.db
      - PUID=${TRIM_UID:-1000}
      - PGID=${TRIM_GID:-1000}
      - TZ=Asia/Shanghai
    mem_limit: 4G
    networks:
      - avdb_net

networks:
  avdb_net:
    driver: bridge

services:
  sqmusic_main:
    # 上游版镜像（网易云+QQ 歌单监听）：CI 从 Helenvin/simple_sq_music_plus 3.0 分支自动构建；GHCR 国内直连 ~3.2MB/s
    image: ghcr.io/helenvin/simple_sq_music_plus:${VERSION}
    container_name: sqmusic_main
    restart: unless-stopped
    environment:
      - DB_IP=mysql
      - DB_PORT=3306
      - DB_NAME=sqmusicv3
      - DB_USERNAME=root
      - DB_PASSWORD=sqmusicv3password
      - TZ=Asia/Shanghai
    volumes:
      # 音乐下载目录：向导留空默认 /vol1/1000/audio/music（与常见手动部署一致，原地接管）
      - ${wizard_music_dir:-/vol1/1000/audio/music}:/music
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sq-app-network
    expose:
      - "8099"

  sqmusic_web:
    # 上游官方 v3 前端镜像（nginx 托管 + /api 反代 sqmusic_main:8099），tag 由 build.sh 从上游 application.yml webversion 注入
    image: ghcr.io/59799517/simple_sq_music_plus_web:${WEB_TAG}
    container_name: sqmusic_web
    restart: unless-stopped
    depends_on:
      - sqmusic_main
    ports:
      - "${TRIM_SERVICE_PORT}:80"
    networks:
      - sq-app-network

  mysql:
    image: ${DOCKER_MIRROR}docker.io/library/mysql:5.7
    container_name: sqmusic_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: sqmusicv3password
      MYSQL_DATABASE: sqmusicv3
      TZ: Asia/Shanghai
    volumes:
      # MySQL 数据目录：向导填旧路径可原地继承既有数据库（下载记录/账号）
      - ${wizard_mysql_dir:-${TRIM_PKGVAR:?}/mysql_data}:/var/lib/mysql
    networks:
      - sq-app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  sq-app-network:
    driver: bridge

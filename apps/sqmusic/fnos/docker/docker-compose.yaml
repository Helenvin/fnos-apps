services:
  sqmusic_main:
    image: registry.cn-hangzhou.aliyuncs.com/sqdockler/simple_sq_music_plus:${VERSION}
    container_name: sqmusic_main
    restart: unless-stopped
    environment:
      - DB_IP=mysql
      - DB_PORT=3306
      - DB_NAME=sqmusicv3
      - DB_USERNAME=root
      - DB_PASSWORD=sqmusicv3password
      - TZ=Asia/Shanghai
    volumes:
      # 音乐下载目录：向导留空默认 /vol1/1000/audio/music（与常见手动部署一致，原地接管）
      - ${wizard_music_dir:-/vol1/1000/audio/music}:/music
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sq-app-network
    expose:
      - "8099"

  sqmusic_web:
    image: ${DOCKER_MIRROR}docker.io/library/nginx:1.27-alpine
    container_name: sqmusic_web
    restart: unless-stopped
    ports:
      - "${TRIM_SERVICE_PORT}:80"
    volumes:
      # 打补丁的前端构建产物（含 QQ 发现页）与 nginx 配置（含 /qq/ Referer 代理）
      - ../webdist/dist:/usr/share/nginx/html:ro
      - ../webdist/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - sqmusic_main
    networks:
      - sq-app-network

  mysql:
    image: ${DOCKER_MIRROR}docker.io/library/mysql:5.7
    container_name: sqmusic_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: sqmusicv3password
      MYSQL_DATABASE: sqmusicv3
      TZ: Asia/Shanghai
    volumes:
      # MySQL 数据目录：向导填旧路径可原地继承既有数据库（下载记录/账号）
      - ${wizard_mysql_dir:-${TRIM_PKGVAR:?}/mysql_data}:/var/lib/mysql
    networks:
      - sq-app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  sq-app-network:
    driver: bridge

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 添加对 PWA 所需的 MIME 类型支持
    map $sent_http_content_type $expires {
        default                    off;
        ~text/html                 epoch;
        ~text/css                  max;
        ~application/javascript    max;
        ~image/                    max;
        ~application/manifest\+json max;
        ~application/json          max;
    }

    # 日志格式
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    keepalive_requests 100;
    gzip  on;

    # 启用 gzip 压缩以提高加载速度
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        application/manifest+json;

    # WebSocket 升级映射（lxserver 同步功能）
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 定义后端服务器
    upstream sqmusic_main {
        server sqmusic_main:8099 weight=10 max_fails=3 fail_timeout=60s;
        keepalive 32;
    }

    # 洛雪播放器服务端（发现页嵌入，XCQ0607/lxserver）
    upstream lxserver {
        server lxserver:9527;
        keepalive 16;
    }

    server {
        listen       80;
        server_name  localhost;

        # 设置缓存策略
        expires $expires;

        # 添加PWA特定的MIME类型
        location ~* \.webmanifest$ {
            add_header Content-Type application/manifest+json;
            root   /usr/share/nginx/html;
        }

        # 前端静态文件
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # ==================== lxserver（洛雪播放器，发现页） ====================
        # 播放器页面与静态资源（PLAYER_PATH=/lx，服务端原生支持前缀映射）
        location = /lx {
            return 301 /lx/;
        }
        location /lx/ {
            proxy_pass http://lxserver;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 15s;
            proxy_send_timeout 120s;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        # lxserver 全局注入 JS（播放器 index.html 绝对路径引用）
        location /js/ {
            proxy_pass http://lxserver;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_connect_timeout 15s;
            proxy_read_timeout 30s;
        }

        # Subsonic 协议（音流/Feishin 等客户端）
        location /rest/ {
            proxy_pass http://lxserver;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_connect_timeout 15s;
            proxy_read_timeout 120s;
            proxy_buffering off;
        }

        # lxserver API 白名单分派（与 sqmusic 后端 /api/* 逐一比对无重叠路径）：
        #   /api/user|custom-source|admin → lx 独占前缀
        #   /api/music/{cache,custom,remaster,auth,leaderboard,identify,tipSearch,progress,comment,download,config,user} → lx 特有子路径
        # 其余 /api/* 照旧走 sqmusic_main（正则 location 优先于前缀 location /api）
        location ~ ^/api/(user|custom-source|admin)(/|$) {
            proxy_pass http://lxserver;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 15s;
            proxy_send_timeout 120s;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }
        location ~ ^/api/music/(cache|custom|remaster|auth|leaderboard|identify|tipSearch|progress|comment|download|config|user)(/|$) {
            proxy_pass http://lxserver;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 15s;
            proxy_send_timeout 120s;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        # API 请求代理到后端
        location /api {
            proxy_pass http://sqmusic_main;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 禁止传递请求中的Cookie到后端
            proxy_set_header Cookie "";

            # 隐藏后端返回的Set-Cookie头部
            proxy_hide_header Set-Cookie;

            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering off;

            # 错误处理
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 20s;
        }

        # QQ 音乐 fcg 接口代理（发现页）：注入 Referer，绕过浏览器无法携带的防盗链头
        location /qq/ {
            proxy_pass https://c.y.qq.com/;
            proxy_set_header Referer "https://y.qq.com/";
            proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36";
            proxy_set_header Host c.y.qq.com;
            proxy_ssl_server_name on;
            proxy_connect_timeout 15s;
            proxy_send_timeout 20s;
            proxy_read_timeout 20s;
        }

        # 酷狗接口代理（发现页）：榜单/歌手/专辑 mobiles 网关
        location /kg/ {
            proxy_pass https://mobiles.kugou.com/;
            proxy_set_header Referer "https://m.kugou.com/";
            proxy_set_header User-Agent "Mozilla/5.0 (Linux; Android 12) AppleWebKit/537.36 Chrome/126 Mobile";
            proxy_set_header Host mobiles.kugou.com;
            proxy_ssl_server_name on;
            proxy_connect_timeout 15s;
            proxy_send_timeout 20s;
            proxy_read_timeout 20s;
        }

        # 错误页面
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
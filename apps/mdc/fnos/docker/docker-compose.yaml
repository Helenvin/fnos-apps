services:
  mdc:
    image: ${DOCKER_MIRROR}docker.io/mdcng/mdc:${VERSION}
    container_name: mdc
    restart: unless-stopped
    environment:
      - PUID=${TRIM_UID:-1000}
      - PGID=${TRIM_GID:-1000}
      - TZ=Asia/Shanghai
      - MDC_USERNAME=${wizard_username:-admin}
      - MDC_PASSWORD=${wizard_password:-admin}
    ports:
      - "${TRIM_SERVICE_PORT}:9208"
    volumes:
      # 配置目录：向导留空时使用应用专属数据空间（TRIM_PKGVAR，fnOS 自动管理）；
      # 填写旧路径可原地继承手动部署的既有配置/数据库
      - ${wizard_config_dir:-${TRIM_PKGVAR:?}/config}:/config
      # 媒体库目录：向导留空默认挂载存储空间根目录 /vol1/1000
      - ${wizard_media_dir:-/vol1/1000}:/media
